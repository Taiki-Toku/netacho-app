<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171917">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22%23222522%22/%3E%3Cg%20transform%3D%22translate%28104%2C136%29%20scale%281.6%29%22%3E%3Cg%20stroke-width%3D%228%22%20stroke-linejoin%3D%22round%22%3E%3Cpolygon%20points%3D%224%2C4%2070%2C4%20186%2C112%20186%2C146%20122%2C146%204%2C40%22%20fill%3D%22%23F2F2EE%22%20stroke%3D%22%23F2F2EE%22/%3E%3Cpolygon%20points%3D%224%2C74%2062%2C128%2062%2C146%204%2C146%22%20fill%3D%22%23F2F2EE%22%20stroke%3D%22%23F2F2EE%22/%3E%3Cpolygon%20points%3D%22122%2C4%20186%2C4%20186%2C86%20122%2C26%22%20fill%3D%22%2391A995%22%20stroke%3D%22%2391A995%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<title>NODAL 試作(見本データ)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap');
:root{
  color-scheme:dark;
  --bg:#171917;--surface:#222522;--surface-2:#292D29;--surface-3:#323831;
  --ink:#E8E9E4;--ink-soft:#C1C8C2;--muted:#A1A69D;--line:#3A403B;
  --accent:#91A995;--accent-strong:#A5B9A8;--accent-wash:#293A31;
  --red:#e08b78;--red-wash:#422d2a;--orange:#d6a36d;--orange-wash:#3e3428;
  --yellow:#c7b66b;--yellow-wash:#3c3928;--green:#91b7a8;--green-wash:#293a34;
  --shadow:0 16px 40px rgba(0,0,0,.2);--radius:16px;--sidebar:232px;
  font-family:'DM Sans','Noto Sans JP','Hiragino Sans','Yu Gothic UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:88px}
h1,h2,h3{text-wrap:balance}
button,a,[role="link"]{touch-action:manipulation}
::selection{background:var(--accent);color:#171917}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px}
.icon{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 上のバー */
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 32px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;cursor:pointer}
.brand-mark{width:34px;height:27px;flex:none}
.brand-name{font-family:'Space Grotesk','DM Sans',sans-serif;font-size:19px;letter-spacing:.19em;font-weight:600;line-height:1}
.topbar-right{display:flex;align-items:center;gap:18px}
.date-label{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.searchbox{height:40px;width:min(300px,30vw);display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 12px;color:var(--muted)}
.searchbox input{width:100%;border:0;outline:0;background:transparent;font-size:14px}
.searchbox input::placeholder{color:var(--muted)}

/* 骨組み */
.workspace{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);max-width:1680px;margin:0 auto}
.sidebar{height:calc(100vh - 72px);position:sticky;top:72px;padding:28px 16px 22px 22px;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.nav-label{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:700;padding:0 12px;margin:0 0 10px}
.nav-group{display:grid;gap:2px}
.nav-link{width:100%;min-height:44px;display:flex;align-items:center;gap:12px;padding:0 12px;border:0;border-radius:8px;background:transparent;text-align:left;color:var(--muted);font-size:14px;cursor:pointer}
.nav-link:hover{background:var(--surface-2);color:var(--ink)}
.nav-link.active{background:var(--accent-wash);color:var(--accent-strong);font-weight:700}
.nav-count{margin-left:auto;font-size:12px}
.main-area{min-width:0;padding:34px clamp(22px,3vw,48px) 80px}
.content-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:36px;max-width:1320px;margin:0 auto}
.main-column{min-width:0;max-width:820px}
.right-rail{display:grid;align-content:start;gap:18px}
.genre-tabs{display:none}

/* 見出しまわり */
.page-heading{font-size:clamp(26px,3vw,34px);letter-spacing:-.02em;line-height:1.3;font-weight:600;margin:0 0 6px}
.page-subtitle{font-size:14px;color:var(--muted);margin:0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:36px 0 12px}
.section-title{font-size:18px;font-weight:600;margin:0}
.section-caption{font-size:12px;color:var(--muted)}
.text-link{border:0;background:transparent;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;padding:10px 0}
.text-link:hover{color:var(--accent-strong)}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent)}

/* 画像 */
.ph{width:100%;height:100%;object-fit:cover;filter:saturate(.62) brightness(.82)}
.noimg{width:100%;height:100%;display:grid;place-items:center;background:var(--surface-3);color:var(--muted);font-weight:700;letter-spacing:.08em}

/* 今朝のトップ */
.feature{margin-top:24px;display:grid;grid-template-columns:1fr 1.05fr;min-height:290px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow);cursor:pointer}
.feature-copy{padding:30px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.feature h2{font-weight:600;font-size:clamp(21px,2.1vw,27px);line-height:1.55;margin:12px 0}
.feature-desc{font-size:14px;color:var(--muted);line-height:1.9;margin:0}
.meta-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:18px}
.feature-image{min-height:290px;background:var(--surface-3);font-size:28px}

/* 記事の行 */
.article-list{border-top:1px solid var(--line)}
.article-row{display:grid;grid-template-columns:22px minmax(0,1fr) 132px;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);cursor:pointer}
.article-row.no-order{grid-template-columns:minmax(0,1fr) 132px}
.article-row:hover .article-title{color:var(--accent-strong)}
.order{font-size:14px;color:var(--muted);line-height:1.9}
.article-title{font-size:16px;font-weight:600;line-height:1.65;margin:4px 0 6px}
.article-summary{font-size:13px;line-height:1.75;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.article-meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;margin-top:8px}
.article-thumb{width:132px;height:92px;border-radius:8px;overflow:hidden;background:var(--surface-3);font-size:18px}
.save-btn{margin-left:auto;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}
.save-btn:hover{background:var(--surface-2)}
.save-btn.saved{color:var(--accent-strong)}
.save-btn.saved .icon{fill:currentColor}

/* 右の列 */
.rail-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.rail-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rail-title{font-size:14px;font-weight:700;margin:0}
.rail-desc{font-size:13px;color:var(--muted);margin:6px 0 0;line-height:1.7}
.rail-divider{height:1px;background:var(--line);margin:12px 0 2px}
.score{display:flex;align-items:baseline;gap:8px;margin:12px 0 2px}
.score strong,.cve-score strong,.stat strong,.promo .n{font-variant-numeric:tabular-nums}
.score strong{font-size:32px;letter-spacing:-.04em;font-weight:600;color:var(--red);line-height:1}
.score span{font-size:12px;color:var(--muted)}
.mini-list{display:grid;gap:12px;margin-top:12px}
.mini-item{display:block;width:100%;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.mini-item strong{display:block;font-size:13px;font-weight:600;line-height:1.55}
.mini-item span{display:block;font-size:12px;color:var(--muted);margin-top:2px}

/* 深刻度 */
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px}
.pill.critical{color:var(--red);background:var(--red-wash)}
.pill.high{color:var(--orange);background:var(--orange-wash)}
.pill.medium{color:var(--yellow);background:var(--yellow-wash)}
.pill.low{color:var(--green);background:var(--green-wash)}
.pill.plain{color:var(--ink-soft);background:var(--surface-3)}

/* 絞り込み */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 14px;color:var(--ink-soft);font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#171917;font-weight:700}

/* 公式のお知らせ */
.feed-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.feed-badge{width:44px;height:44px;border-radius:10px;background:var(--surface-3);display:grid;place-items:center;font-size:13px;font-weight:700;letter-spacing:.04em}
.feed-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
.feed-top .when{margin-left:auto;color:var(--muted)}
.feed-title{font-size:15px;line-height:1.65;margin:5px 0 0}

/* 脆弱性 */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:22px 0}
.stat{border:2px solid transparent;border-radius:10px;padding:14px 16px;text-align:left;cursor:pointer;width:100%}
.stat.on{border-color:currentColor}
.stat span{display:block;font-size:12px;font-weight:700}
.stat strong{display:block;font-size:28px;line-height:1.2;margin-top:6px;font-weight:600}
.stat.critical{color:var(--red);background:var(--red-wash)}.stat.high{color:var(--orange);background:var(--orange-wash)}
.stat.medium{color:var(--yellow);background:var(--yellow-wash)}.stat.low{color:var(--green);background:var(--green-wash)}
.cve-list{display:grid;gap:10px}
.cve-card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:18px;cursor:pointer}
.cve-card:hover{border-color:var(--accent)}
.cve-top{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}
.cve-main{display:flex;align-items:flex-start;gap:20px;margin-top:10px}
.cve-id{font-size:15px;font-weight:700}
.cve-product{font-size:13px;color:var(--muted);margin-top:3px}
.cve-score{margin-left:auto;text-align:right;flex:none}
.cve-score strong{font-size:26px;line-height:1;color:var(--red)}
.cve-score span{display:block;font-size:12px;color:var(--muted)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{background:var(--surface-2);border-radius:4px;padding:3px 8px;font-size:12px;color:var(--ink-soft)}
.fields{margin-top:16px}
.field{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:11px 0;font-size:13px}
.field span:first-child{color:var(--muted)}
.field span:last-child{text-align:right;font-weight:600}

/* 詳細 */
.detail{max-width:660px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;padding:0;margin-bottom:12px}
.back:hover{color:var(--accent)}
.detail-title{font-size:clamp(24px,3vw,34px);line-height:1.55;font-weight:600;margin:12px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.action{display:inline-flex;align-items:center;gap:8px;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 14px;font-size:13px;color:var(--ink-soft);cursor:pointer}
.action:hover,.action.on{color:var(--accent-strong);border-color:var(--accent)}
.action.on .icon{fill:currentColor}
.hero{width:100%;height:clamp(210px,34vw,360px);border-radius:12px;overflow:hidden;margin:8px 0 24px;background:var(--surface-3);font-size:32px}
.box{background:var(--surface-2);border-radius:12px;padding:20px 22px;margin:0 0 28px}
.box ul,.box ol{margin:10px 0 0;padding-left:20px;color:var(--ink-soft);font-size:15px;line-height:1.95}
.ai-note{font-size:12px;color:var(--muted);margin:10px 0 0}
.body h2{font-size:19px;font-weight:600;margin:30px 0 10px}
.body p{margin:0 0 18px;font-size:16px;line-height:2;color:var(--ink-soft)}
.source{margin:30px 0 0;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.source p{font-size:13px;color:var(--muted);margin:4px 0 0}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.rate button{min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px;cursor:pointer}
.rate button.on{background:var(--accent);border-color:var(--accent);color:#171917;font-weight:700}
.memo{width:100%;margin-top:10px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:15px;line-height:1.7;resize:vertical}
.memo::placeholder{color:var(--muted)}
.empty{padding:52px 22px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink-soft);font-size:15px;margin-bottom:4px}
.empty p{font-size:13px;margin:0}
.sample-note{font-size:12px;color:var(--muted);margin-top:18px}
.promo{display:none}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,14px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.mobile-nav{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

@media(max-width:1100px){.content-grid{grid-template-columns:minmax(0,1fr)}.right-rail{display:none}.promo{display:flex}}
@media(max-width:767px){
  .topbar{height:60px;padding:0 16px}.date-label{display:none}.searchbox{width:150px;height:40px}
  .workspace{display:block}.sidebar{display:none}
  .genre-tabs{display:flex;gap:22px;padding:0 16px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:60px;z-index:15;scrollbar-width:none}
  .genre-tabs::-webkit-scrollbar{display:none}
  .genre-tabs button{flex:none;height:46px;border:0;background:none;color:var(--muted);font-size:14px;cursor:pointer;padding:0;border-bottom:2px solid transparent}
  .genre-tabs button.active{color:var(--ink);font-weight:700;border-bottom-color:var(--accent-strong)}
  .main-area{padding:22px 16px 104px}
  .page-heading{font-size:26px}
  .feature{display:flex;flex-direction:column-reverse;min-height:0;margin-top:18px}
  .feature-image{height:196px;min-height:196px}
  .feature-copy{padding:18px 18px 20px}.feature h2{font-size:21px;margin:8px 0}
  .article-row{grid-template-columns:18px minmax(0,1fr) 96px;gap:12px;padding:16px 0}
  .article-row.no-order{grid-template-columns:minmax(0,1fr) 96px}
  .article-thumb{width:96px;height:76px}
  .article-title{font-size:15px}.article-summary{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mobile-nav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;padding:6px 6px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);z-index:30}
  .mobile-nav button{min-height:52px;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;cursor:pointer}
  .mobile-nav button.active{color:var(--accent-strong);font-weight:700}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}
.promo{width:100%;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;cursor:pointer}
.promo strong{display:block;font-size:14px}.promo small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.promo .n{font-size:22px;font-weight:700;color:var(--red);white-space:nowrap}
</style>
</head>

<nav class="genre-tabs" id="tabs" aria-label="ジャンル"></nav>

  <button data-nav="vuln"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/></svg><span>脆弱性</span></button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* すべて見本データ(架空)。写真は Unsplash の配信元を直接参照している。本番では記事元の画像に置き換える。 */
const U=id=>`https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=1200&q=80`;
const GENRES=[['work','仕事・自動化'],['agent','エージェント'],['local-llm','ローカルLLM'],['security-news','セキュリティニュース'],['product','プロダクト'],['creative','VTuber・創作'],['tools','ツール・業界']];
const gname=id=>(GENRES.find(g=>g[0]===id)||['',''])[1];
const ITEMS=[
 {id:'1',order:1,genre:'agent',title:'夜のうちに点検を終わらせる。エージェントに任せるサーバー巡回の組み方',lead:'夜間の定型チェックを3つの役割に分けると、朝は結果を読むだけになる。',source:'Fooix Blog',image:U('1558494949-ef010cbdcc31'),
  points:['巡回を「集める」「見比べる」「報告する」の3役に分ける','異常があったサーバーだけを報告の先頭に並べる','渡す権限は読み取りだけにする'],
  tryit:['検証用のサーバー1台で、状態を集める役だけを作る','前日の結果と見比べる役を足し、差が出た項目だけを残す','朝7時に結果を届ける設定にして、1週間まわす'],
  caution:'再起動や設定変更まで任せる話は、元の記事でも別の回に分けられています。'},
 {id:'2',order:2,genre:'local-llm',title:'メモリ16GBのノートPCで動かす。軽量モデル3種を同じ質問で比べた',lead:'速さと答えの質を、同じ10問でそろえて測った記録。',source:'Tanuki Lab',image:U('1496181133206-80ce9b88a853'),points:['3種とも16GBで動く','長文の要約では差が大きい'],tryit:['手元のPCで1種だけ入れて、同じ10問を試す'],caution:'測った環境は1台だけです。'},
 {id:'3',order:3,genre:'work',title:'手順書の表を直すだけで設定ファイルができる。パラメータシート運用の始め方',lead:'表を正にして、設定と手順書を同じ元から作る流れ。',source:'Infra Notes',image:U('1497366754035-f200968a6e72'),points:['表が正、設定は生成物','差分はレビューで見る'],tryit:['いちばん小さい設定1つで試す'],caution:'既存の手順書との二重管理に注意。'},
 {id:'4',order:4,genre:'security-news',title:'物流大手のサンプル運輸、不正アクセスで受注システムを2日間停止',lead:'侵入経路は保守用の遠隔接続。復旧までの経過をまとめる。',source:'サンプル新聞',image:U('1486406146926-c627a92ad1ab'),points:['保守用の接続が入口','復旧に2日'],tryit:['自社の保守用の接続を棚卸しする'],caution:'原因は調査中とされています。'},
 {id:'5',order:5,genre:'product',title:'Norvane OS 9.4 が公開。更新の前に確かめたい変更点は3つ',lead:'暗号設定の既定値が変わる。既存の接続に影響が出る場合がある。',source:'Norvane 公式',image:'',initial:'NV',points:['暗号設定の既定値が変更','カーネルを更新'],tryit:['検証環境で接続を確かめる'],caution:'対象の版は公式のリリースノートで確認を。'},
 {id:'6',order:6,genre:'creative',title:'配信ソフトの新しい音声フィルター、雑音の消え方を試した',lead:'キーボードの音とエアコンの音で、前の版と聞き比べた。',source:'Haishin Memo',image:U('1516321318423-f06f85e504b3'),points:['打鍵音はよく消える','声の高い音が少し削れる'],tryit:['自分のマイクで録って聞き比べる'],caution:'強くかけすぎると声がこもります。'},
 {id:'7',order:7,genre:'tools',title:'クラウド3社の料金改定を1枚の表で見比べる',lead:'値上げの対象と時期を、同じ項目でそろえた。',source:'Cloud Watch JP',image:U('1518770660439-4636190af475'),points:['対象は保存と転送','時期は各社で違う'],tryit:['自分の請求書の上位3項目に当てはめる'],caution:'金額は各社の公式ページで確認を。'}
];
const KINDS=[['release','リリース'],['eol','サポート終了'],['exam','試験'],['outage','障害']];
const FEED=[
 {id:'f1',kind:'release',badge:'NV',product:'Norvane OS',title:'9.4 を公開。暗号設定の既定値が変わります',when:'今日 5:40'},
 {id:'f2',kind:'outage',badge:'SH',product:'Skyharbor Cloud',title:'東京リージョンでストレージの遅延(2:10〜3:25)',when:'今日 3:30',status:'復旧済み'},
 {id:'f3',kind:'eol',badge:'F3',product:'Fooix 3',title:'標準サポートは2027年3月まで。延長は別契約',when:'昨日 18:00'},
 {id:'f4',kind:'exam',badge:'NV',product:'Norvane 認定試験',title:'1月12日から出題範囲を改定。旧範囲は1月11日まで',when:'昨日 15:20'},
 {id:'f5',kind:'release',badge:'OS',product:'Orbit Switch OS',title:'12.1.3 を公開。スタック構成の不具合を修正',when:'昨日 9:05'}
];
const SEV={critical:'緊急',high:'重要',medium:'警告',low:'注意'};
const VULNS=[
 {id:'CVE-2026-90001',sev:'critical',score:'9.8',product:'Kestrel Firewall 7.2',vendor:'Kestrel Networks',date:'11月16日',status:'修正版 7.2.4 あり',summary:'認証の前に、遠隔から操作される可能性があります。',tags:['遠隔から','認証の回避']},
 {id:'CVE-2026-90002',sev:'high',score:'8.1',product:'Container Deck 4',vendor:'Northstar Labs',date:'11月15日',status:'修正版あり',summary:'特定の条件で、権限を上げられる可能性があります。',tags:['権限の昇格']},
 {id:'CVE-2026-90003',sev:'medium',score:'6.5',product:'Open Data Connector',vendor:'コミュニティ',date:'11月14日',status:'回避策あり',summary:'入力の検査が足りず、情報が漏れる可能性があります。',tags:['情報の漏えい']},
 {id:'CVE-2026-90004',sev:'low',score:'3.7',product:'Desk Utility',vendor:'Example Software',date:'11月13日',status:'修正予定',summary:'限られた条件で、サービスが止まる可能性があります。',tags:['サービスの停止']}
];
const NEWS=new Set(['security-news','product']);
const RATES=[['hot','熱い'],['good','良い'],['meh','ふつう'],['no','いまいち']];
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let later=new Set(store.get('nodal-later',[])),fb=store.get('nodal-fb',{});
let view='home',arg=null,prev='home',kind='all',sev='all';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BM='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-4-6 4Z"/></svg>';
const img=a=>a.image?`<img class="ph" src="${a.image}" alt="" width="1200" height="800" loading="lazy" data-initial="${esc(a.initial||gname(a.genre).slice(0,2))}">`:`<div class="noimg" aria-hidden="true">${esc(a.initial||'')}</div>`;
function row(a,numbered){return `<article class="article-row ${numbered?'':'no-order'}" data-item="${a.id}" tabindex="0" role="link" aria-label="${esc(a.title)}">${numbered?`<div class="order">${a.order}</div>`:''}<div><div class="label">${esc(gname(a.genre))}</div><h3 class="article-title">${esc(a.title)}</h3><p class="article-summary">${esc(a.lead)}</p><div class="article-meta"><span>${esc(a.source)}</span><button class="save-btn ${later.has(a.id)?'saved':''}" data-later="${a.id}" aria-label="保存する" aria-pressed="${later.has(a.id)}">${BM}</button></div></div><div class="article-thumb">${img(a)}</div></article>`}
function feedRow(f){const lab=(KINDS.find(k=>k[0]===f.kind)||[])[1];return `<div class="feed-row"><div class="feed-badge" aria-hidden="true">${esc(f.badge)}</div><div><div class="feed-top"><strong>${esc(f.product)}</strong><span class="pill plain">${lab}${f.status?' '+esc(f.status):''}</span><span class="when">${esc(f.when)}</span></div><p class="feed-title">${esc(f.title)}</p></div></div>`}
function cveCard(v){return `<article class="cve-card" data-cve="${v.id}" tabindex="0" role="link" aria-label="${v.id}"><div class="cve-top"><span class="pill ${v.sev}">${SEV[v.sev]}</span><span>公開 ${v.date}</span></div><div class="cve-main"><div><div class="cve-id">${v.id}</div><div class="cve-product">${esc(v.product)}(${esc(v.vendor)})</div></div><div class="cve-score"><strong>${v.score}</strong><span>CVSS</span></div></div><div class="tags">${v.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}<span class="tag">${esc(v.status)}</span></div></article>`}
function rail(){const v=VULNS[0];const l=ITEMS.filter(a=>later.has(a.id)).slice(0,3);return `<aside class="right-rail"><section class="rail-card"><div class="rail-head"><h3 class="rail-title">脆弱性ウォッチ</h3><span class="pill critical">${SEV[v.sev]}</span></div><div class="score"><strong>${v.score}</strong><span>CVSS</span></div><div style="font-size:14px;font-weight:700">${v.id}</div><p class="rail-desc">${esc(v.product)}<br>${esc(v.status)}</p><div class="rail-divider"></div><button class="text-link" data-nav="vuln">脆弱性をすべて見る</button></section><section class="rail-card"><h3 class="rail-title">公式のお知らせ</h3><div class="mini-list">${FEED.slice(0,3).map(f=>`<div class="mini-item"><strong>${esc(f.product)}:${esc(f.title)}</strong><span>${esc(f.when)}</span></div>`).join('')}</div><div class="rail-divider"></div><button class="text-link" data-nav="feed">お知らせをすべて見る</button></section><section class="rail-card"><h3 class="rail-title">保存したネタ</h3><div class="mini-list">${l.length?l.map(a=>`<button class="mini-item" data-item="${a.id}"><strong>${esc(a.title)}</strong><span>${esc(a.source)}</span></button>`).join(''):'<p class="rail-desc" style="margin:0">しおりの印を押すと、ここに並びます。</p>'}</div></section></aside>`}
const shell=(c,r=true)=>`<div class="content-grid"><section class="main-column">${c}</section>${r?rail():''}</div>`;
function home(){const f=ITEMS[0];return shell(`<h1 class="page-heading">今朝のネタ</h1><p class="page-subtitle">11月16日 月曜日。全${ITEMS.length}本、放送の順に並んでいます。</p><article class="feature" data-item="${f.id}" tabindex="0" role="link" aria-label="${esc(f.title)}"><div class="feature-copy"><div class="label">今朝のトップ</div><h2>${esc(f.title)}</h2><p class="feature-desc">${esc(f.lead)}</p><div class="meta-row"><span class="label">${esc(gname(f.genre))}</span><span>${esc(f.source)}</span></div></div><div class="feature-image">${img(f)}</div></article><button class="promo" data-nav="vuln"><span><strong>脆弱性ウォッチ</strong><small>${VULNS[0].id} ${esc(VULNS[0].product)}</small></span><span class="n">${VULNS[0].score}</span></button><div class="section-head"><h2 class="section-title">今朝のラインナップ</h2><span class="section-caption">あと${ITEMS.length-1}本</span></div><div class="article-list">${ITEMS.slice(1).map(a=>row(a,true)).join('')}</div><p class="sample-note">表示しているのは、すべて見本用の架空データです。</p>`)}
function genre(g){const list=ITEMS.filter(a=>a.genre===g);const official=g==='product';const fl=FEED.filter(f=>kind==='all'||f.kind===kind);return shell(`<h1 class="page-heading">${esc(gname(g))}</h1><p class="page-subtitle">${list.length}本のネタ${official?'と、公式のお知らせ':''}</p>${list.length?`<div class="article-list" style="margin-top:22px">${list.map(a=>row(a,false)).join('')}</div>`:`<div class="empty" style="margin-top:22px"><strong>今朝はこのジャンルのネタがありません</strong><p>過去のネタは「さがす」から探せます。</p></div>`}${official?`<div class="section-head"><h2 class="section-title">公式のお知らせ</h2></div>${kindChips()}<div>${fl.map(feedRow).join('')||'<div class="empty"><strong>該当するお知らせがありません</strong><p>別の種類を選んでください。</p></div>'}</div>`:''}`)}
const kindChips=()=>`<div class="chips" style="margin-bottom:6px">${[['all','すべて'],...KINDS].map(k=>`<button class="chip ${kind===k[0]?'active':''}" data-kind="${k[0]}" aria-pressed="${kind===k[0]}">${k[1]}</button>`).join('')}</div>`;
function feed(){const fl=FEED.filter(f=>kind==='all'||f.kind===kind);return shell(`<h1 class="page-heading">公式のお知らせ</h1><p class="page-subtitle">各社の公式の配信(RSS)を、そのまま並べています。AIによる要約はしていません。</p><div class="toolbar">${kindChips()}<span class="section-caption">${fl.length}件</span></div><div style="border-top:1px solid var(--line)">${fl.map(feedRow).join('')||'<div class="empty" style="margin-top:14px"><strong>該当するお知らせがありません</strong><p>別の種類を選んでください。</p></div>'}</div>`)}
function vuln(){const c=s=>VULNS.filter(v=>v.sev===s).length;const fl=VULNS.filter(v=>sev==='all'||v.sev===sev);return shell(`<h1 class="page-heading">脆弱性</h1><p class="page-subtitle">深刻度と、修正の状況から確かめます。</p><div class="stats">${Object.keys(SEV).map(s=>`<button class="stat ${s} ${sev===s?'on':''}" data-sev="${s}" aria-pressed="${sev===s}"><span>${SEV[s]}</span><strong>${c(s)}</strong></button>`).join('')}</div><div class="toolbar"><span class="section-caption">${sev==='all'?'すべて':SEV[sev]+'だけ'}を表示中。${fl.length}件(新しい順)</span>${sev==='all'?'':'<button class="chip" data-sev="all">絞り込みを外す</button>'}</div><div class="cve-list">${fl.map(cveCard).join('')}</div><p class="sample-note">CVE番号と点数は、画面を確かめるための架空のものです。</p>`,false)}
function cve(v){return `<div class="detail"><button class="back" data-back><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>脆弱性の一覧に戻る</button><h1 class="detail-title">${v.id}</h1><div class="cve-main" style="margin:0 0 16px"><span class="pill ${v.sev}">${SEV[v.sev]}</span><div class="cve-score"><strong>${v.score}</strong><span>CVSS</span></div></div><p style="font-size:16px;line-height:2;color:var(--ink-soft);margin:0">${esc(v.summary)}</p><div class="fields">${[['対象の製品',v.product],['ベンダー',v.vendor],['公開日',v.date],['修正の状況',v.status],['情報源','ベンダーの公式の勧告(想定)']].map(f=>`<div class="field"><span>${f[0]}</span><span>${esc(f[1])}</span></div>`).join('')}</div><div class="body"><h2>確かめること</h2><p>使っている版が対象に入るかを確かめ、ベンダーの公式の修正情報を読んでください。急ぐかどうかは、一次情報と実際の構成から判断します。</p></div></div>`}
function detail(a){const f=fb[a.id]||{};return `<div class="detail"><button class="back" data-back><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>一覧に戻る</button><div class="label">${esc(gname(a.genre))}</div><h1 class="detail-title">${esc(a.title)}</h1><div class="meta-row" style="margin-top:0"><span>${esc(a.source)}</span><span>11月16日</span></div><div class="actions"><button class="action ${later.has(a.id)?'on':''}" data-later="${a.id}" aria-pressed="${later.has(a.id)}">${BM}${later.has(a.id)?'保存済み':'保存する'}</button></div><div class="hero">${img(a)}</div><div class="box"><div class="label">要点</div><ul>${a.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><p class="ai-note">この要点は、元の記事をもとにAIがまとめたものです。</p></div><div class="body"><p>${esc(a.lead)}</p></div><div class="box"><div class="label">${NEWS.has(a.genre)?'確かめること':'試してみる'}</div><ol>${a.tryit.map(p=>`<li>${esc(p)}</li>`).join('')}</ol></div><div class="body"><h2>気をつけること</h2><p>${esc(a.caution)}</p></div><div class="source"><div><div class="label">出典</div><p>${esc(a.source)}</p></div><a class="action" href="#" data-noop>元の記事を読む</a></div><div class="section-head"><h2 class="section-title">このネタ、どうでしたか</h2></div><div class="rate">${RATES.map(r=>`<button data-rate="${r[0]}" class="${f.rating===r[0]?'on':''}" aria-pressed="${f.rating===r[0]}">${r[1]}</button>`).join('')}</div><div class="section-head"><label class="section-title" for="memo">メモ</label></div><textarea class="memo" id="memo" rows="3" placeholder="試した結果や、思いついたことを書く">${esc(f.memo||'')}</textarea><p class="ai-note" id="memoState" aria-live="polite"></p></div>`}
function laterView(){const l=ITEMS.filter(a=>later.has(a.id));return shell(`<h1 class="page-heading">保存したネタ</h1><p class="page-subtitle">気になったネタを、ここにためておきます。</p>${l.length?`<div class="article-list" style="margin-top:22px">${l.map(a=>row(a,false)).join('')}</div>`:`<div class="empty" style="margin-top:22px"><strong>まだ何も入っていません</strong><p>ネタの右下にある、しおりの印を押すと入ります。</p></div>`}`)}
function search(t){const s=t.toLowerCase();const a=ITEMS.filter(x=>(x.title+x.lead+x.source+gname(x.genre)).toLowerCase().includes(s));const v=VULNS.filter(x=>(x.id+x.product+x.vendor+x.summary).toLowerCase().includes(s));const f=FEED.filter(x=>(x.product+x.title).toLowerCase().includes(s));return shell(`<h1 class="page-heading">「${esc(t)}」の結果</h1><div class="section-head"><h2 class="section-title">ネタ</h2><span class="section-caption">${a.length}件</span></div>${a.length?`<div class="article-list">${a.map(x=>row(x,false)).join('')}</div>`:'<div class="empty"><strong>一致するネタがありません</strong><p>別の言葉で試してください。</p></div>'}<div class="section-head"><h2 class="section-title">公式のお知らせ</h2><span class="section-caption">${f.length}件</span></div><div>${f.map(feedRow).join('')||'<div class="empty"><strong>一致するお知らせがありません</strong><p>製品名でも探せます。</p></div>'}</div><div class="section-head"><h2 class="section-title">脆弱性</h2><span class="section-caption">${v.length}件</span></div><div class="cve-list">${v.map(cveCard).join('')||'<div class="empty"><strong>一致する脆弱性がありません</strong><p>CVE番号や製品名でも探せます。</p></div>'}</div>`)}
function render(){let h='';if(view==='home')h=home();else if(view==='genre')h=genre(arg);else if(view==='feed')h=feed();else if(view==='vuln')h=vuln();else if(view==='later')h=laterView();else if(view==='item')h=detail(ITEMS.find(a=>a.id===arg));else if(view==='cve')h=cve(VULNS.find(v=>v.id===arg));else if(view==='search')h=search(arg);$('view').innerHTML=h;const key=view==='genre'?'g:'+arg:view;document.querySelectorAll('[data-nav]').forEach(e=>e.classList.toggle('active',e.dataset.nav===key));$('laterCount').textContent=later.size;$('vulnCount').textContent=VULNS.length}
function go(v,a=null){if(v.startsWith('g:')){a=v.slice(2);v='genre'}view=v;arg=a;kind='all';sev='all';if(v!=='search')$('q').value='';render();window.scrollTo(0,0)}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}
const navBtn=(k,l)=>`<button data-nav="${k}" class="nav-link">${l}</button>`;
$('sideGenres').innerHTML=navBtn('home','今日')+GENRES.map(g=>navBtn('g:'+g[0],g[1])).join('');
$('tabs').innerHTML='<button data-nav="home">今日</button>'+GENRES.map(g=>`<button data-nav="g:${g[0]}">${g[1]}</button>`).join('');
document.addEventListener('click',e=>{const t=e.target;let el;
 if(el=t.closest('[data-noop]')){e.preventDefault();toast('見本のため、リンク先はありません');return}
 if(el=t.closest('[data-later]')){e.stopPropagation();const id=el.dataset.later;if(later.has(id)){later.delete(id);toast('保存から外しました')}else{later.add(id);toast('保存しました')}store.set('nodal-later',[...later]);render();return}
 if(el=t.closest('[data-rate]')){const f=fb[arg]||(fb[arg]={});f.rating=f.rating===el.dataset.rate?'':el.dataset.rate;store.set('nodal-fb',fb);render();return}
 if(el=t.closest('[data-kind]')){kind=el.dataset.kind;render();return}
 if(el=t.closest('[data-sev]')){sev=sev===el.dataset.sev?'all':el.dataset.sev;render();return}
 if(t.closest('[data-back]')){go(view==='cve'?'vuln':prev.startsWith('g:')?prev:prev);return}
 if(el=t.closest('[data-nav]')){go(el.dataset.nav);return}
 if(el=t.closest('[data-item]')){prev=view==='genre'?'g:'+arg:(['home','later','feed'].includes(view)?view:'home');go('item',el.dataset.item);return}
 if(el=t.closest('[data-cve]')){go('cve',el.dataset.cve);return}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-item],[data-cve]'))e.target.click()});
document.addEventListener('input',e=>{if(e.target.id==='memo'){(fb[arg]||(fb[arg]={})).memo=e.target.value;store.set('nodal-fb',fb);$('memoState').textContent='メモを保存しました'}if(e.target.id==='q'){const v=e.target.value.trim();if(v){view='search';arg=v;render()}else if(view==='search')go('home')}});
/* 画像が取れなかったときは、頭文字の札に置き換える */
document.addEventListener('error',e=>{const i=e.target;if(i.tagName==='IMG'&&i.classList.contains('ph')){const d=document.createElement('div');d.className='noimg';d.setAttribute('aria-hidden','true');d.textContent=i.dataset.initial||'';i.replaceWith(d)}},true);
render();
</script>
</body>
